[project]
name = "iconoscope"
version = "0.2.0"
description = "python package for exploring image collections using visual similarity based on image embeddings extracted from models"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "rlskoeser", email = "rebecca.s.koeser@princeton.edu" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Visualization"
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "lap>=0.4",
    "numpy>=2.0",
    "pillow>=10.0",
    "polars>=1.41.2",
    "scikit-learn>=1.2",
    "scipy>=1.14",
    "umap-learn>=0.5",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "tqdm>=4.68.2",
    "transformers>=5.12.1",
    "h5py>=3.16.0",
]

[project.scripts]
iconoscope = "iconoscope.cli:main"

[dependency-groups]
dev = [
    "altair>=6.3.0",
    "marimo>=0.25.1",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "wigglystuff>=0.5.36",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"


[tool.marimo.runtime]
pythonpath = ["src"]
