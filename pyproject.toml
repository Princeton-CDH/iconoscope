[project]
name = "iconoscope"
version = "0.3.0.dev0"
description = "python package for exploring image collections using visual similarity based on image embeddings extracted from models"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "rlskoeser", email = "rebecca.s.koeser@princeton.edu" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Visualization"
]
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "numpy>=2.0",
    "pillow>=10.0",
    "polars>=1.41.2",
]

[project.optional-dependencies]
# extracting embeddings with vision models (embed command)
embed = [
    "accelerate>=1.14.0",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "tqdm>=4.68.2",
    "transformers>=5.12.1",
]
# umap, clustering, and mosaics (umap, cluster, mosaic commands)
analysis = [
    "lap>=0.4",
    "scikit-learn>=1.2",
    "scipy>=1.14",
    "tqdm>=4.68.2",
    "umap-learn>=0.5",
]
all = ["iconoscope[embed,analysis]"]

[project.scripts]
iconoscope = "iconoscope.cli:main"

[dependency-groups]
test = [
    "iconoscope[all]",
    "pytest>=8.0",
    "pytest-cov>=7.1.0"
]
notebooks = [
    "altair>=6.3.0",
    "marimo>=0.25.1",
    "piffle>=0.9.0",
    "wigglystuff>=0.5.36",
]
dev = ["iconoscope[test,notebooks]"]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"


[tool.marimo.runtime]
# Add project source directory to python path
pythonpath = ["src"]

# match ruff's default line length so marimo and the ruff pre-commit hook agree
[tool.marimo.formatting]
line_length = 88

[tool.marimo.display]
cell_output = "below"
theme = "system"      # honor user preference, including in static html exports

[tool.marimo.save]
format_on_save = true

[tool.marimo.diagnostics]
enabled = true

[tool.marimo.experimental]
lsp = true
