name: Unit Tests
on:
  push: # run on push to any branches
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  # python version used for reporting coverage to codecov (locked resolution only)
  COVERAGE_PYTHON_VERSION: "3.14"
jobs:
  test:
    name: Run unit tests (Python ${{ matrix.python-version }}, ${{ matrix.resolution }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        resolution: ["locked"]
        sync-args: ["--locked"]
        include:
          # oldest supported python with minimum declared direct dependencies
          - python-version: "3.12"
            resolution: "lowest-direct"
            sync-args: "--resolution lowest-direct"
          # newest supported python with latest available dependencies
          - python-version: "3.14"
            resolution: "highest"
            sync-args: "--resolution highest --upgrade"
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v.8.2.0
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --no-default-groups --group test --python ${{ matrix.python-version }} ${{ matrix.sync-args }}
      - name: Run tests with coverage
        run: uv run --no-sync --python ${{ matrix.python-version }} pytest --cov=iconoscope --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: matrix.python-version == env.COVERAGE_PYTHON_VERSION && matrix.resolution == 'locked'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Princeton-CDH/iconoscope
